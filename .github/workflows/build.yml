name: Build Geode Mod

on:
  workflow_dispatch:
  push:
    branches:
      - '**'

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        config:
          - name: Windows
            os: windows-latest

    name: ${{ matrix.config.name }}
    runs-on: ${{ matrix.config.os }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build Mod
        uses: geode-sdk/build-geode-mod@main
        with:
          sdk: 'v5.11.2'
          combine: true

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MegaHack-Geode-Windows
          path: |
            *.geode
            build*/**/*.geode
